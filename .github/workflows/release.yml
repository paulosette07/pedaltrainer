name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publicar executavel
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Testar
        run: dotnet test tests/PedalTrainer.Tests/PedalTrainer.Tests.csproj -c Release

      - name: Publicar executavel unico
        run: dotnet publish src/PedalTrainer.App/PedalTrainer.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o dist/publish

      # O aviso do SmartScreen ("O Windows protegeu o computador") so desaparece com
      # assinatura de code signing. Sem os secrets abaixo o build continua funcionando,
      # apenas gera um executavel sem assinatura.
      - name: Detectar certificado de assinatura
        id: cert
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.PEDALTRAINER_PFX_BASE64 }}
        run: |
          $presente = -not [string]::IsNullOrWhiteSpace($env:PFX_BASE64)
          "presente=$($presente.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if (-not $presente) {
            Write-Host "::warning title=Build sem assinatura::PEDALTRAINER_PFX_BASE64 nao configurado: o executavel sai sem assinatura e o SmartScreen vai avisar."
          }

      - name: Assinar executavel
        if: steps.cert.outputs.presente == 'true'
        shell: pwsh
        env:
          PEDALTRAINER_PFX_BASE64: ${{ secrets.PEDALTRAINER_PFX_BASE64 }}
          PEDALTRAINER_PFX_PASSWORD: ${{ secrets.PEDALTRAINER_PFX_PASSWORD }}
        run: ./tools/signing/Sign-Binary.ps1 -Path dist/publish/PedalTrainer.exe

      - name: Conferir assinatura
        shell: pwsh
        env:
          ASSINATURA_ESPERADA: ${{ steps.cert.outputs.presente }}
        run: |
          $assinatura = Get-AuthenticodeSignature -LiteralPath 'dist/publish/PedalTrainer.exe'
          Write-Host "Status da assinatura: $($assinatura.Status)"

          if ($assinatura.SignerCertificate) {
            Write-Host "Signatario: $($assinatura.SignerCertificate.Subject)"
            Write-Host "Carimbo de tempo: $($assinatura.TimeStamperCertificate.Subject)"
          }

          if ($env:ASSINATURA_ESPERADA -eq 'true' -and $assinatura.Status -ne 'Valid') {
            throw "O executavel deveria estar assinado, mas o status e $($assinatura.Status)."
          }

          $assinatura | Out-String | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      # Permite conferir que o download chegou inteiro, mesmo sem assinatura digital.
      - name: Gerar checksum SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath 'dist/publish/PedalTrainer.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PedalTrainer.exe" | Set-Content -LiteralPath 'dist/publish/PedalTrainer.exe.sha256' -Encoding ascii -NoNewline
          Write-Host "SHA-256: $hash"
          "``$hash``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Guardar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PedalTrainer-win-x64
          path: |
            dist/publish/PedalTrainer.exe
            dist/publish/PedalTrainer.exe.sha256

      - name: Anexar na release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/publish/PedalTrainer.exe
            dist/publish/PedalTrainer.exe.sha256
          generate_release_notes: true
          append_body: true
          body: |
            ## Aviso do Windows (SmartScreen)

            Este executável **não tem assinatura digital**, então na primeira execução o Windows
            mostra *"O Windows protegeu o computador"* com o publicador como *Desconhecido*. Não é
            detecção de vírus: o SmartScreen bloqueia qualquer executável baixado da internet que
            ainda não tenha histórico de downloads.

            Para rodar: **Mais informações** → **Executar assim mesmo**. Também é possível
            desbloquear antes de abrir (botão direito no `.exe` → **Propriedades** →
            **Desbloquear**) ou com `Unblock-File .\PedalTrainer.exe`.

            Confira o download com o arquivo `PedalTrainer.exe.sha256` anexado aqui:
            `certutil -hashfile PedalTrainer.exe SHA256`.

            O aviso só desaparece com um certificado de code signing — o workflow já está pronto
            para assinar quando os secrets `PEDALTRAINER_PFX_BASE64` e
            `PEDALTRAINER_PFX_PASSWORD` existirem.
